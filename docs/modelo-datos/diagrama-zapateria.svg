<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="920" viewBox="0 0 1370 920" role="img" aria-labelledby="erd-title erd-desc"><title id="erd-title">Modelo entidad-relación de la zapatería</title><desc id="erd-desc">Cinco tablas. Clientes tiene pedidos; pedidos contiene detalles; productos tiene variantes; cada detalle referencia una variante. Relaciones uno a muchos.</desc><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce4ec"/></pattern></defs><rect width="1370" height="920" fill="#f6f8fb"/><rect width="1370" height="920" fill="url(#dots)"/><style>text{font-family:Arial,sans-serif}.edge{fill:none;stroke:#64748b;stroke-width:2.3}.edge-label{font-size:14px;fill:#334155}.node{transition:opacity .15s}.muted{opacity:.2}.field{font-size:16px;fill:#172b42}.dtype{font-size:13px;fill:#526579}.key{font-size:11px;font-weight:700;fill:#334155}.table-title{font-size:21px;font-weight:700;fill:white}.sub{font-size:13px;fill:white}.rule{font-size:13px;fill:#475569}</style><g class="edge-group" data-a="clientes" data-b="pedidos"><path class="edge" d="M412 170 H500"/><text x="428" y="157" class="edge-label">1</text><text x="470" y="157" class="edge-label">0..N</text></g><g class="edge-group" data-a="pedidos" data-b="detalles_pedido"><path class="edge" d="M880 170 H968"/><text x="895" y="157" class="edge-label">1</text><text x="933" y="157" class="edge-label">1..N*</text></g><g class="edge-group" data-a="productos" data-b="variantes"><path class="edge" d="M412 640 H500"/><text x="428" y="627" class="edge-label">1</text><text x="467" y="627" class="edge-label">0..N</text></g><g class="edge-group" data-a="variantes" data-b="detalles_pedido"><path class="edge" d="M880 700 H934 V430 H1158 V324"/><text x="890" y="724" class="edge-label">1</text><text x="1170" y="390" class="edge-label">0..N</text></g><g class="node" data-table="clientes"><rect x="34" y="49" width="380" height="280" rx="14" fill="#dce4ec" opacity=".55"/><rect x="32" y="44" width="380" height="280" rx="14" fill="white" stroke="#d7e1eb"/><path d="M46 44 H398 Q412 44 412 58 V121 H32 V58 Q32 44 46 44" fill="#087f73"/><text x="50" y="75" class="table-title">Clientes</text><text x="50" y="100" class="sub">Quién realiza la compra</text><rect x="33" y="125" width="378" height="33" fill="#f5f8fb"/><text x="44" y="147" class="key">PK</text><text x="77" y="147" class="field">id</text><text x="267" y="147" class="dtype">BIGINT</text><text x="44" y="181" class="key"></text><text x="77" y="181" class="field">nombre</text><text x="267" y="181" class="dtype">VARCHAR(120)</text><rect x="33" y="193" width="378" height="33" fill="#f5f8fb"/><text x="44" y="215" class="key">UK</text><text x="77" y="215" class="field">email</text><text x="267" y="215" class="dtype">VARCHAR(254)</text><text x="44" y="249" class="key"></text><text x="77" y="249" class="field">telefono</text><text x="267" y="249" class="dtype">VARCHAR(30)</text><rect x="33" y="261" width="378" height="33" fill="#f5f8fb"/><text x="44" y="283" class="key"></text><text x="77" y="283" class="field">activo</text><text x="267" y="283" class="dtype">BOOLEAN</text></g><g class="node" data-table="pedidos"><rect x="502" y="49" width="380" height="246" rx="14" fill="#dce4ec" opacity=".55"/><rect x="500" y="44" width="380" height="246" rx="14" fill="white" stroke="#d7e1eb"/><path d="M514 44 H866 Q880 44 880 58 V121 H500 V58 Q500 44 514 44" fill="#2463b3"/><text x="518" y="75" class="table-title">Pedidos</text><text x="518" y="100" class="sub">Cabecera de la venta</text><rect x="501" y="125" width="378" height="33" fill="#f5f8fb"/><text x="512" y="147" class="key">PK</text><text x="545" y="147" class="field">id</text><text x="735" y="147" class="dtype">BIGINT</text><text x="512" y="181" class="key">FK</text><text x="545" y="181" class="field">cliente_id</text><text x="735" y="181" class="dtype">BIGINT</text><rect x="501" y="193" width="378" height="33" fill="#f5f8fb"/><text x="512" y="215" class="key"></text><text x="545" y="215" class="field">fecha_creacion</text><text x="735" y="215" class="dtype">TIMESTAMPTZ</text><text x="512" y="249" class="key"></text><text x="545" y="249" class="field">estado</text><text x="735" y="249" class="dtype">VARCHAR(20)</text></g><g class="node" data-table="detalles_pedido"><rect x="970" y="49" width="380" height="280" rx="14" fill="#dce4ec" opacity=".55"/><rect x="968" y="44" width="380" height="280" rx="14" fill="white" stroke="#d7e1eb"/><path d="M982 44 H1334 Q1348 44 1348 58 V121 H968 V58 Q968 44 982 44" fill="#2463b3"/><text x="986" y="75" class="table-title">Detalles de pedido</text><text x="986" y="100" class="sub">Qué se compra y a qué precio</text><rect x="969" y="125" width="378" height="33" fill="#f5f8fb"/><text x="980" y="147" class="key">PK</text><text x="1013" y="147" class="field">id</text><text x="1203" y="147" class="dtype">BIGINT</text><text x="980" y="181" class="key">FK</text><text x="1013" y="181" class="field">pedido_id</text><text x="1203" y="181" class="dtype">BIGINT</text><rect x="969" y="193" width="378" height="33" fill="#f5f8fb"/><text x="980" y="215" class="key">FK</text><text x="1013" y="215" class="field">variante_id</text><text x="1203" y="215" class="dtype">BIGINT</text><text x="980" y="249" class="key"></text><text x="1013" y="249" class="field">cantidad</text><text x="1203" y="249" class="dtype">INTEGER</text><rect x="969" y="261" width="378" height="33" fill="#f5f8fb"/><text x="980" y="283" class="key"></text><text x="1013" y="283" class="field">precio_unitario</text><text x="1203" y="283" class="dtype">NUMERIC(10,2)</text></g><g class="node" data-table="productos"><rect x="34" y="495" width="380" height="314" rx="14" fill="#dce4ec" opacity=".55"/><rect x="32" y="490" width="380" height="314" rx="14" fill="white" stroke="#d7e1eb"/><path d="M46 490 H398 Q412 490 412 504 V567 H32 V504 Q32 490 46 490" fill="#8750aa"/><text x="50" y="521" class="table-title">Productos</text><text x="50" y="546" class="sub">Modelo de zapato y precio actual</text><rect x="33" y="571" width="378" height="33" fill="#f5f8fb"/><text x="44" y="593" class="key">PK</text><text x="77" y="593" class="field">id</text><text x="267" y="593" class="dtype">BIGINT</text><text x="44" y="627" class="key"></text><text x="77" y="627" class="field">nombre</text><text x="267" y="627" class="dtype">VARCHAR(150)</text><rect x="33" y="639" width="378" height="33" fill="#f5f8fb"/><text x="44" y="661" class="key"></text><text x="77" y="661" class="field">marca</text><text x="267" y="661" class="dtype">VARCHAR(80)</text><text x="44" y="695" class="key"></text><text x="77" y="695" class="field">descripcion</text><text x="267" y="695" class="dtype">TEXT</text><rect x="33" y="707" width="378" height="33" fill="#f5f8fb"/><text x="44" y="729" class="key"></text><text x="77" y="729" class="field">precio</text><text x="267" y="729" class="dtype">NUMERIC(10,2)</text><text x="44" y="763" class="key"></text><text x="77" y="763" class="field">activo</text><text x="267" y="763" class="dtype">BOOLEAN</text></g><g class="node" data-table="variantes"><rect x="502" y="495" width="380" height="348" rx="14" fill="#dce4ec" opacity=".55"/><rect x="500" y="490" width="380" height="348" rx="14" fill="white" stroke="#d7e1eb"/><path d="M514 490 H866 Q880 490 880 504 V567 H500 V504 Q500 490 514 490" fill="#b15d15"/><text x="518" y="521" class="table-title">Variantes</text><text x="518" y="546" class="sub">Modelo + talla + color = stock propio</text><rect x="501" y="571" width="378" height="33" fill="#f5f8fb"/><text x="512" y="593" class="key">PK</text><text x="545" y="593" class="field">id</text><text x="735" y="593" class="dtype">BIGINT</text><text x="512" y="627" class="key">FK</text><text x="545" y="627" class="field">producto_id</text><text x="735" y="627" class="dtype">BIGINT</text><rect x="501" y="639" width="378" height="33" fill="#f5f8fb"/><text x="512" y="661" class="key">UK</text><text x="545" y="661" class="field">sku</text><text x="735" y="661" class="dtype">VARCHAR(64)</text><text x="512" y="695" class="key"></text><text x="545" y="695" class="field">talla</text><text x="735" y="695" class="dtype">VARCHAR(10)</text><rect x="501" y="707" width="378" height="33" fill="#f5f8fb"/><text x="512" y="729" class="key"></text><text x="545" y="729" class="field">color</text><text x="735" y="729" class="dtype">VARCHAR(50)</text><text x="512" y="763" class="key"></text><text x="545" y="763" class="field">stock</text><text x="735" y="763" class="dtype">INTEGER</text><rect x="501" y="775" width="378" height="33" fill="#f5f8fb"/><text x="512" y="797" class="key"></text><text x="545" y="797" class="field">activo</text><text x="735" y="797" class="dtype">BOOLEAN</text></g><text x="32" y="875" class="rule">* Cada pedido debe contener al menos una línea: se garantiza en la transacción de la API.</text><text x="32" y="899" class="rule">1 = uno · 0..N = cero o muchos · 1..N = uno o muchos. Cada FK es obligatoria y referencia un único registro padre.</text></svg>